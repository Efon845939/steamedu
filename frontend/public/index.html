<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="STEAM Hub: quizzes, hands-on activities and idea sharing for students and teachers" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>STEAM Hub</title>
        <script>
            // Lite mode: decide before React mounts so the first paint already matches,
            // and only download the Inter web font when lite mode is off.
            // Keep in sync with src/hooks/use-lite-mode.js.
            (function () {
                var doc = document;
                var lite = false;
                try {
                    var stored = null;
                    try {
                        stored = window.localStorage.getItem('steamhub:lite');
                    } catch (e) {}
                    if (stored === '1') {
                        lite = true;
                    } else if (stored !== '0') {
                        var connection = navigator.connection;
                        lite = !!(connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || '')));
                    }
                } catch (e) {}
                if (lite) {
                    doc.documentElement.classList.add('lite');
                    return;
                }
                try {
                    var preconnect = doc.createElement('link');
                    preconnect.rel = 'preconnect';
                    preconnect.href = 'https://fonts.gstatic.com';
                    preconnect.crossOrigin = 'anonymous';
                    doc.head.appendChild(preconnect);
                    var font = doc.createElement('link');
                    font.id = 'inter-font';
                    font.rel = 'stylesheet';
                    font.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
                    doc.head.appendChild(font);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
